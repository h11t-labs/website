name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch
  push:
    branches: [main]
  # Type-check and build every pull request (no deploy), so a broken PR —
  # including Dependabot bumps — shows up red before it's merged
  pull_request:
  # ...and allow manual runs from the Actions tab
  workflow_dispatch:

# Least-privilege token; the deploy job adds what Pages deployment needs (OIDC)
permissions:
  contents: read

# Deploys run one at a time and an in-progress deploy finishes rather than
# being cancelled. PR checks get their own group and newer pushes cancel
# older runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22 # project requires >=22.12 (see package.json engines)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check # astro check: .astro/.ts types + content schema

      - name: Build site
        run: npm run build # astro build + strips the dev-only /system page

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
